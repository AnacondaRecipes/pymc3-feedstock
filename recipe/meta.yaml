{% set version = "3.11.4" %}

package:
  name: pymc3
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/p/pymc3/pymc3-{{ version }}.tar.gz
  sha256: 3b88d1e6c85f7fb8a9b99d6f136ac860672170370ec4146338fdd160c3b3fd3f

build:
  number: 0
  skip: true  # [py<37]
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python
    - pip
    - numpy
    - setuptools
    - wheel
  run:
    - python
    - arviz >=0.11.0
    - cachetools >=4.2.1
    - dill
    - fastprogress >=0.2.0
    - {{ pin_compatible('numpy') }}
    - pandas >=0.24.0
    - patsy >=0.5.1
    - scipy >=1.2.0
    - semver >=2.13.0
    - theano-pymc ==1.1.2
    - typing-extensions >=3.7.4


test:
  imports:
    - pymc3
    - pymc3.backends
    - pymc3.distributions
    - pymc3.glm
    - pymc3.gp
    - pymc3.ode
    - pymc3.plots
    - pymc3.smc
    - pymc3.stats
    - pymc3.step_methods
    - pymc3.tests
    - pymc3.tuning
    - pymc3.variational
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/pymc-devs/pymc
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  summary: Probabilistic Programming in Python
  dev_url: https://github.com/pymc-devs/pymc
  doc_url: https://docs.pymc.io/en/stable/

extra:
  recipe-maintainers:
    - ericmjl
    - springcoil
    - twiecki
    - fonnesbeck
    - michaelosthege
    - maresb
